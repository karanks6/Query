name: query
description: Query — Learn SQL through a detective investigation game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local persistence - meta-database
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.25

  # Local persistence - sandbox execution engine
  sqlite3: ^2.4.6

  # UI & animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.3.2
  lottie: ^3.1.2

  # Audio
  just_audio: ^0.9.41

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_app_check: ^0.4.7
  share_plus: ^12.0.2
  http: ^1.6.0
  archive: ^4.2.0
  firebase_storage: ^13.5.0
  shared_preferences: ^2.5.3
  sensors_plus: ^7.1.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.1
  drift_dev: ^2.20.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon/App Logo.png"
  image_path: "assets/icon/App Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/levels/world_01_archive_vaults/
    - assets/levels/world_02_filter_district/
    - assets/levels/world_03_aggregation_district/
    - assets/levels/world_04_join_nexus/
    - assets/levels/world_05_nested_depths/
    - assets/levels/world_06_data_forge/
    - assets/levels/daily_challenges/
    - assets/concept_cards/
    - assets/audio/terminal_classic/
    - assets/images/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
